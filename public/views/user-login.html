<html lang="en" dir="ltr" data-i18n-default="en">

<head>
  <meta charset="UTF-8">
  <title>Log in - Student Helper</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tab / window icon. Without these the browser asks for /favicon.ico,
       finds nothing, and falls back to the grey globe. The SVG is what
       modern browsers use (it stays sharp at any size and follows the tab
       bar's pixel density); the PNG and .ico are there for the ones that do
       not read SVG icons, and the apple-touch-icon is what iOS puts on the
       home screen. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/images/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="alternate icon" href="/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#12996b">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>


  </style>
  <link rel="stylesheet" href="../css/design-system.css">
  <script src="../js/theme.js"></script>
  <script src="../js/i18n.js"></script>
</head>
<header class="header" id="page-header" style="position:relative;">
  <h1 class="texth" id="header-title">Student Helper</h1>
</header>

<body>
  <div class="login-container" id="login-container">
    <div class="login-box" id="login-box">
      <h1 class="login-header" id="login-header" data-i18n="login.header">User Login</h1>
      <!-- Error message container -->
      <div id="error-container"></div>

      <form action="/" method="POST" id="login-form">
        <!-- Username Input -->
        <input type="text" class="input-field" id="username" name="username" placeholder="Username" data-i18n-placeholder="login.username" required>

        <!-- Password Input -->
        <input type="password" class="input-field" id="password" name="password" placeholder="Password" data-i18n-placeholder="login.password" required>

        <!-- Login Button -->
        <button type="submit" class="btn-login" id="login-button" data-i18n="login.button">Login</button>
      </form>

      <div id="google-block" hidden>
      <div style="display:flex; align-items:center; gap:10px; margin:16px 0; color:var(--sh-muted, #888); font-size:12px;">
        <div style="flex:1; height:1px; background:currentColor; opacity:0.25;"></div>
        <span data-i18n="login.or">OR</span>
        <div style="flex:1; height:1px; background:currentColor; opacity:0.25;"></div>
      </div>

      <a href="/auth/google" id="google-login-button" style="display:flex; align-items:center; justify-content:center; gap:10px; width:100%; height:3rem; border-radius:var(--sh-radius-sm, 8px); background:#fff; color:#3c4043; border:1px solid #dadce0; font-weight:600; font-size:0.95rem; text-decoration:none; box-sizing:border-box;">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
          <path fill="#FFC107" d="M43.611,20.083H42V20H24v8h11.303c-1.649,4.657-6.08,8-11.303,8c-6.627,0-12-5.373-12-12s5.373-12,12-12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C12.955,4,4,12.955,4,24s8.955,20,20,20s20-8.955,20-20C44,22.659,43.862,21.35,43.611,20.083z"/>
          <path fill="#FF3D00" d="M6.306,14.691l6.571,4.819C14.655,15.108,18.961,12,24,12c3.059,0,5.842,1.154,7.961,3.039l5.657-5.657C34.046,6.053,29.268,4,24,4C16.318,4,9.656,8.337,6.306,14.691z"/>
          <path fill="#4CAF50" d="M24,44c5.166,0,9.86-1.977,13.409-5.192l-6.19-5.238C29.211,35.091,26.715,36,24,36c-5.202,0-9.619-3.317-11.283-7.946l-6.522,5.025C9.505,39.556,16.227,44,24,44z"/>
          <path fill="#1976D2" d="M43.611,20.083H42V20H24v8h11.303c-0.792,2.237-2.231,4.166-4.087,5.571c0.001-0.001,0.002-0.001,0.003-0.002l6.19,5.238C36.971,39.205,44,34,44,24C44,22.659,43.862,21.35,43.611,20.083z"/>
        </svg>
        <span data-i18n="login.google">Sign in with Google</span>
      </a>
      </div>

      <div class="login-links" id="login-links">
        <a href="/views/create-account.html" class="create-account-link" id="create-account-link" data-i18n="login.createAccount">Create Account</a>
      </div>
      <div style="text-align:center; margin-top:14px; font-size:12px;">
        <a href="/privacy-policy" style="color:#888;" data-i18n="footer.privacy">سياسة الخصوصية</a>
        &middot;
        <a href="/terms-of-service" style="color:#888;" data-i18n="footer.terms">شروط الاستخدام</a>
      </div>
    </div>
  </div>
  <script>
    // Only offer Google sign-in if the server is actually set up for it.
    // Showing a button that always fails is worse than not showing it.
    fetch('/api/auth/providers')
      .then((r) => (r.ok ? r.json() : null))
      .then((providers) => {
        if (providers && providers.google) {
          document.getElementById('google-block').hidden = false;
        }
      })
      .catch(() => { /* leave it hidden */ });

    // Get the error message from the query parameter. This value is fully
    // attacker-controlled (anyone can craft a /login?error=... link), so it
    // is rendered with textContent, never innerHTML - inserting it as HTML
    // would let a crafted link run arbitrary script in the visitor's
    // browser the moment they open it (reflected XSS).
    const urlParams = new URLSearchParams(window.location.search);
    const error = urlParams.get('error'); // already URL-decoded by URLSearchParams

    // If there's an error, display it
    if (error) {
      const errorContainer = document.getElementById('error-container');
      const errorMessage = document.createElement('p');
      errorMessage.className = 'error-message';
      errorMessage.textContent = error;
      errorContainer.replaceChildren(errorMessage);
    }
  </script>
</body>

</html>
